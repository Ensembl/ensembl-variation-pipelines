# Codon run: copy outside the repo, fill in the placeholders and point the
# cron job at it. Web VEP reads $VEP_DATA_DIR/vep_plugins_data/grch3x/clinvar.vcf.gz.

assemblies: GRCh38,GRCh37
ensembl_release: 116

# GFFs VEP annotates with
gff_grch38: <VEP_DATA_DIR>/<GRCh38 GFF dir>/Homo_sapiens.GRCh38.116.chr.gff.gz
gff_grch37: <VEP_DATA_DIR>/<GRCh37 GFF dir>/genes.gff3.bgz

publish_dir: <VEP_DATA_DIR>/vep_plugins_data
cache_dir: <VEP_DATA_DIR>/vep_plugins_data/cache
keep_releases: 3

queue: production
fetch_queue: datamover
