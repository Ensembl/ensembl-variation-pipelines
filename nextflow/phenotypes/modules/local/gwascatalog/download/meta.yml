name: gwascatalog_download
description: "Download the latest dated GWAS Catalog release or its study-build reference with retries."
keywords:
  - gwascatalog
  - variants
  - source processing
tools:
  - curl:
      description: "Download the latest dated GWAS Catalog release or its study-build reference with retries."
      documentation: https://curl.se/docs/
      licence: ["curl"]
input:
  - - "meta":
        type: map
        description: "Caller metadata with id and extension; passed through unchanged."
    - "input_name":
        type: string
        description: "Input key, either data or study_builds."
    - "url":
        type: string
        description: "Catalog release-directory URL for data, or study-build reference URL for study_builds."
output:
  files:
    - - "meta":
          type: map
          description: "Caller metadata with id and extension; passed through unchanged."
      - "input_name":
          type: string
          description: "Input key identifying the downloaded file."
      - "*.{zip,db}":
          type: file
          description: "Dated association ZIP or study-build database."
          ontologies: []
  versions_curl:
    - - "${task.process}":
          type: string
          description: "Process name."
      - "curl":
          type: string
          description: "Tool name."
      - "curl --version | sed -n '1s/^curl \\([^ ]*\\).*/\\1/p'":
          type: eval
          description: "Numeric curl version."
topics:
  versions:
    - - "${task.process}":
          type: string
          description: "Process name."
      - "curl":
          type: string
          description: "Tool name."
      - "curl --version | sed -n '1s/^curl \\([^ ]*\\).*/\\1/p'":
          type: eval
          description: "Numeric curl version."
authors: []
maintainers: []
