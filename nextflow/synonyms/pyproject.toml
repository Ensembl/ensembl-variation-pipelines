[project]
name = "synonyms"
version = "0.1.0"
description = "Source-aware variant synonym extraction"
requires-python = ">=3.12"
dependencies = ["variation-sources"]

[tool.uv.sources]
variation-sources = { path = "../shared", editable = true }

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
