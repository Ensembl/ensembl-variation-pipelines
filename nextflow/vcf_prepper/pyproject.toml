[project]
name = "vcf-prepper"
description = "Modules used in vcf-prepper Nextflow pipeline for processing VCF files for analysis with Ensembl VEP."
requires-python = ">= 3.10"
dynamic = [
    "version",
]
readme = "README.md"
authors = [
    {name = "Ensembl", email = "dev@ensembl.org"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "ensembl",
    "ensembl-vep",
    "vcf-prepper",
    "nextflow",
    "bioinformatics",
    "annotation",
    "variants",
    "python",
]

dependencies = [
    "deprecated ~= 1.3.1",
    "cyvcf2 ~= 0.32.1",
    "biopython == 1.81",
]
